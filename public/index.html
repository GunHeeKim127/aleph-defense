<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE BACK | 내 자료실</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101a28;color:#ecf4ff}main{max-width:760px;margin:auto;padding:40px 22px}h1{font-size:40px}.eyebrow{color:#8ad8df}p{line-height:1.7;color:#bfd0e5}.panel,li{padding:20px;border:1px solid #51667c;border-radius:14px;background:#1a2a3d;margin:16px 0}label{display:block;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #51667c;border-radius:8px;background:#101a28;color:#ecf4ff}button{padding:10px 16px;border:0;border-radius:8px;background:#8ad8df;color:#101a28;cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.5;cursor:wait}ul{list-style:none;padding:0}li strong{font-size:19px}.body{white-space:pre-wrap;color:#bfd0e5}#status{min-height:24px}[hidden]{display:none!important}
</style>
</head><body><main>
<div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div><h1>내 자료실</h1>
<p>학습용 가상 메모만 사용하세요. 로그인한 계정의 메모를 표시합니다. 개별 메모의 소유자 검사는 4단계에서 추가합니다.</p>
<p id="status" role="status" aria-live="polite">로그인 설정을 확인하는 중입니다.</p>
<form id="login" class="panel">
<h2>로그인</h2><label>이메일<input id="email" type="email" autocomplete="username" required></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
<button id="login-button" disabled>로그인</button>
</form>
<section id="account" class="panel" hidden><span id="account-label"></span><br><button id="logout" type="button">로그아웃</button><button id="refresh" type="button">목록 새로고침</button></section>
<form id="editor" class="panel" hidden><h2 id="editor-heading">가상 메모 추가</h2>
<label>제목<input id="title" maxlength="200" required></label><label>가상 메모 내용<textarea id="body" maxlength="10000" rows="4" required></textarea></label>
<button id="save">추가</button><button id="cancel" type="button" hidden>수정 취소</button></form>
<ul id="notes" aria-live="polite"></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script type="module" src="/app.js"></script>
</body></html>
